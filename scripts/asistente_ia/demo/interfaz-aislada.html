<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente IA · demostración aislada</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;background:#f5f7fb;color:#14283b;margin:0}
main{max-width:760px;margin:5vh auto;padding:24px}
h1{font-size:1.6rem}.aviso{background:#fff8e9;border-left:4px solid #b5791b;padding:14px}
.asistente-ia{background:white;border:1px solid #dce3ed;border-radius:12px;padding:20px}
.asistente-ia-historial{min-height:140px;max-height:360px;overflow:auto}
.asistente-ia-mensaje{border-bottom:1px solid #e5eaf0;padding:10px 0}
label,textarea{display:block;width:100%;box-sizing:border-box}
textarea{padding:10px;margin:8px 0 12px}
button{background:#145c8c;color:white;border:0;border-radius:7px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>Asistente IA · vista de prueba aislada</h1>
<p class="aviso"><strong>Demostración local, sin datos reales.</strong> Las respuestas siguientes son ejemplos ficticios para comprobar la interacción. No se consulta Gemini, Cloudflare ni el Observatorio productivo.</p>
<div id="asistente"></div>
</main>
<script type="module">
import { crearAsistenteUI } from '../../../frontend-v2/js/asistente-ia-ui.js';
const consultar = async pregunta => {
  await Promise.resolve();
  if (/periodo|período|mes|fecha/i.test(pregunta) && !/2026|junio|julio|agosto|septiembre|octubre|noviembre/i.test(pregunta)) {
    return {estado:'aclaracion',pregunta_aclaracion:'¿Qué mes de 2026 deseas consultar? (Ejemplo de aclaración)'};
  }
  return {estado:'respondida',resultado:{explicacion:'Ejemplo de respuesta: la consulta se recibió correctamente. No se han recuperado cifras reales.',datos:{demostracion:true},fuentes:[]}};
};
crearAsistenteUI({contenedor:document.getElementById('asistente'),consultar,habilitado:true});
</script>
</body>
</html>
