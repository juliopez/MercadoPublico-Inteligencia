name: Validar mejoras UX integrales V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend-v2/index.html'
      - 'frontend-v2/js/app.js'
      - 'frontend-v2/js/busqueda-global.js'
      - 'frontend-v2/css/styles.css'
      - 'tests/test_ux_integral_v2.cjs'
      - '.github/workflows/validar-ux-integral-v2.yml'
permissions:
  contents: read
jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis de los cuatro módulos
        run: |
          node --check frontend-v2/js/app.js
          node --check frontend-v2/js/busqueda-global.js
          node --check frontend-v2/js/comparar-proveedores.js
          node --check frontend-v2/js/sugerencias-global.js
      - name: Probar nueve mejoras UX
        run: node tests/test_ux_integral_v2.cjs
