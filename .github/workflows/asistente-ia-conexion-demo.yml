name: Asistente IA - comprobar demo conectada y salud Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend-v2/demo/asistente-ia-conectado.html'
      - '.github/workflows/asistente-ia-conexion-demo.yml'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivo y aislamiento del frontend
        run: |
          test -s frontend-v2/demo/asistente-ia-conectado.html
          grep -q 'crearAsistenteUI' frontend-v2/demo/asistente-ia-conectado.html
          grep -q 'Contrato sin trazabilidad suficiente' frontend-v2/demo/asistente-ia-conectado.html
          if grep -q 'asistente-ia-conectado.html' frontend-v2/index.html; then
            echo 'ERROR: demo enlazada desde el frontend productivo'
            exit 1
          fi
      - name: Verificar publicación en GitHub Pages
        run: |
          URL='https://juliopez.github.io/MercadoPublico-Inteligencia/frontend-v2/demo/asistente-ia-conectado.html'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 12 --retry-all-errors --max-time 15 "$URL" -o /tmp/demo.html
          grep -q 'Asistente IA · conexión experimental' /tmp/demo.html
          echo 'OK: demo publicada'
      - name: Verificar salud pública del Worker sin invocar Gemini
        run: |
          URL='https://observatorio-mercado-publico-ia.julio-c-lopez-n-1972.workers.dev/health'
          curl --fail --silent --show-error --max-time 15 "$URL" -o /tmp/health.json
          python3 -m json.tool /tmp/health.json >/dev/null
          echo 'OK: endpoint health accesible y JSON válido'
      - name: Declarar alcance
        run: |
          echo 'La publicación y /health NO prueban CORS, POST /chat ni compatibilidad de contratos.'
          echo 'No se enviaron preguntas a Gemini ni se modificó producción.'
