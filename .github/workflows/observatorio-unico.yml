name: Observatorio - orquestacion unica
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,9,15,21 * * *' # UTC; Chile continental en octubre (UTC-3): 00,06,12,18
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatorio-operacion-unica
  cancel-in-progress: false
jobs:
  actualizar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias Sheets
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Unica coordinacion de extraccion y carga
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/orquestador_observatorio.py
      - name: Exportar instantanea validada desde Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/publicar_observatorio.py
      - name: Confirmar JSON publico si cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json
          if ! git diff --cached --quiet; then
            git commit -m "data: actualización observatorio por orquestador único"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Desplegar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
