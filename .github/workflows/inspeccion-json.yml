name: Inspeccionar JSON ChileCompra
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar campos del listado y segundo detalle
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/inspeccion_respuesta.py
