name: Validar rotacion mensual MER
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rotar_mes_operativo.py'
      - 'scripts/ubuntu_rotacion_mensual.sh'
      - 'scripts/ejecutar_cierre_supervisado.py'
      - 'deploy/systemd/mercadopublico-rotacion.*'
      - '.github/workflows/validar-rotacion-mensual.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validación sin credenciales ni escrituras
        run: |
          python3 -m py_compile scripts/rotar_mes_operativo.py scripts/ejecutar_cierre_supervisado.py
          bash -n scripts/ubuntu_rotacion_mensual.sh
          python3 - <<'PY'
          import datetime as dt
          from scripts.rotar_mes_operativo import last_business
          assert last_business(dt.date(2026,10,1),set())==dt.date(2026,10,30)
          assert last_business(dt.date(2026,11,2),set())==dt.date(2026,11,30)
          assert last_business(dt.date(2026,12,2),{'2026-12-31'})==dt.date(2026,12,30)
          print('ROTACION_FECHAS_OK')
          PY
