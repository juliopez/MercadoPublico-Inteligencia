name: Diagnosticar detalles multiproceso
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar tres procesos sin modificar Sheets
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/diagnostico_multiproceso.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-multiproceso
          path: output/diagnostico-multiproceso/diagnostico.json
          retention-days: 2
          if-no-files-found: warn
