name: Validar API nocturna MER
on:
  push:
    branches: [main]
    paths:
      - 'scripts/mer_api_incremental_10.py'
      - 'scripts/exportar_mer_operativo_v2.py'
      - '.github/workflows/validar-api-nocturna.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis y esquemas offline
        run: |
          python -m py_compile scripts/mer_api_incremental_10.py scripts/exportar_mer_operativo_v2.py scripts/adaptar_detalle_compra_agil_mer.py
          PYTHONPATH=scripts python -c "from importador_historicos_v2 import SCHEMA; assert all(k in SCHEMA for k in ('Procesos','Ofertas','Resultados'))"
