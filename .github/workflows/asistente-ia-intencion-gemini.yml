name: Asistente IA - contrato de intenciones Gemini
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/asistente_ia/backend/intencion.mjs'
      - 'scripts/asistente_ia/backend/intencion.test.mjs'
      - '.github/workflows/asistente-ia-intencion-gemini.yml'
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check scripts/asistente_ia/backend/intencion.mjs
          node --check scripts/asistente_ia/backend/intencion.test.mjs
      - name: Ejecutar pruebas de contrato sin consumir API Gemini
        run: node --test scripts/asistente_ia/backend/intencion.test.mjs
