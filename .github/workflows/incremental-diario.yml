name: Incremental diario ChileCompra (procesos)
on:
  schedule:
    # 16:00 UTC es mediodía o 13:00 en Chile continental según horario de verano.
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatorio-incremental-diario
  cancel-in-progress: false
jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Fijar fecha de publicación (hoy en Chile)
        shell: bash
        run: |
          echo "SYNC_FECHA_2026=$(TZ=America/Santiago date +%F)" >> "$GITHUB_ENV"
          echo "Fecha de carga incremental: $(TZ=America/Santiago date +%F)"
      - name: Extraer procesos por modalidad con recuperación cada 30 minutos
        id: extract
        shell: bash
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          SYNC_MAX_PAGES: '20'
        run: |
          failures=0
          for mode in licitaciones compra_agil; do
            ok=0
            for attempt in 1 2 3 4; do
              echo "::notice title=Incremental::$mode fecha $SYNC_FECHA_2026 intento $attempt/4"
              if SYNC_MODALIDAD="$mode" python3 scripts/sync_chilecompra_sheets.py; then
                ok=1
                echo "::notice title=ETL completado::$mode para $SYNC_FECHA_2026"
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                echo "::warning title=ETL pendiente::$mode falló. Reintento en 30 minutos, sin modificar la fecha de publicación"
                sleep 1800
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error title=ETL no completado::$mode sigue fallando tras 4 ejecuciones. Se requiere revisión."
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error title=Publicación omitida::No se publicarán datos como si la carga incremental estuviera completa."
            exit 1
          fi
      - name: Exportar solo campos públicos de Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/publicar_observatorio.py
      - name: Confirmar snapshot público en repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json
          if ! git diff --cached --quiet; then
            git commit -m "data: carga incremental diaria $SYNC_FECHA_2026"
            git push
          fi
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Desplegar actualización
        id: deployment
        uses: actions/deploy-pages@v4
