name: Inspeccionar detalle de orden
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detalle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Revisar estructura de una orden
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/esquema_detalle_orden.py
