name: Validación integral controlada (máximo 10 procesos)
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de publicación Chile (AAAA-MM-DD)'
        required: true
        type: string
        default: '2026-10-15'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: validacion-integral-observatorio
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      SYNC_FECHA_2026: ${{ inputs.fecha }}
      API_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Validar fecha y asegurar tope de procesos
        run: |
          python - <<'PY'
          from datetime import date
          from zoneinfo import ZoneInfo
          from datetime import datetime
          day=date.fromisoformat("${{ inputs.fecha }}")
          assert day<=datetime.now(ZoneInfo("America/Santiago")).date(), "Fecha futura"
          print("Tope estricto de escritura: 5 procesos por modalidad, 10 en total")
          PY
      - name: ETL procesos de licitaciones (máximo 5)
        env:
          SYNC_MODALIDAD: licitaciones
          SYNC_MAX_RECORDS: '5'
          SYNC_MANIFEST_FILE: /tmp/validacion_licitaciones.txt
        run: python scripts/sync_chilecompra_sheets.py
      - name: ETL procesos de Compra Ágil (máximo 5)
        env:
          SYNC_MODALIDAD: compra_agil
          SYNC_MAX_RECORDS: '5'
          SYNC_MAX_PAGES: '20'
          SYNC_MANIFEST_FILE: /tmp/validacion_compra_agil.txt
        shell: bash
        run: |
          # Máximo tres intentos, separados por 30 minutos. El fallo final detiene publicación.
          for attempt in 1 2 3; do
            echo "::notice title=Compra Ágil::Intento $attempt/3 para la fecha $SYNC_FECHA_2026"
            if python scripts/sync_chilecompra_sheets.py; then
              echo "::notice title=Compra Ágil::Extracción completada"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=API temporalmente no disponible::Reintento en 30 minutos"
              sleep 1800
            fi
          done
          echo "::error title=Compra Ágil fallida::Tres intentos agotados; no publicar"
          exit 1
      - name: Detalle de licitaciones (máximo 5)
        env:
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_OFFSET: '0'
          DETAIL_MAX_CODES: '5'
          DETAIL_MANIFEST_FILE: /tmp/validacion_licitaciones.txt
        run: python scripts/enriquecer_licitaciones.py
      - name: Ofertas y resultados Compra Ágil (máximo 5 procesos)
        env:
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_OFFSET: '0'
          DETAIL_MAX_CODES: '5'
          DETAIL_MANIFEST_FILE: /tmp/validacion_compra_agil.txt
        run: python scripts/etl_multiproceso_manual.py
      - name: Exportar Google Sheets a JSON público
        run: python scripts/publicar_observatorio.py
      - name: Publicar sólo si todos los ETL terminaron bien
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json
          if ! git diff --cached --quiet; then
            git commit -m "data: validación integral del Observatorio"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
