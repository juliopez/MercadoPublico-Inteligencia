name: Validación integral controlada (máximo 10 procesos)
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de publicación Chile (AAAA-MM-DD)'
        required: true
        type: string
        default: '2026-10-15'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: validacion-integral-observatorio
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      SYNC_FECHA_2026: ${{ inputs.fecha }}
      API_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Validar fecha y asegurar tope de procesos
        run: |
          python - <<'PY'
          from datetime import date
          from zoneinfo import ZoneInfo
          from datetime import datetime
          day=date.fromisoformat("${{ inputs.fecha }}")
          assert day<=datetime.now(ZoneInfo("America/Santiago")).date(), "Fecha futura"
          print("Tope estricto de escritura: 5 procesos por modalidad, 10 en total")
          PY
      - name: ETL procesos de licitaciones (máximo 5)
        env:
          SYNC_MODALIDAD: licitaciones
          SYNC_MAX_RECORDS: '5'
          SYNC_MANIFEST_FILE: /tmp/validacion_licitaciones.txt
        run: python scripts/sync_chilecompra_sheets.py
      - name: ETL procesos de Compra Ágil (máximo 5; fallo aislado)
        id: agile
        continue-on-error: true
        env:
          SYNC_MODALIDAD: compra_agil
          SYNC_MAX_RECORDS: '5'
          SYNC_MAX_PAGES: '20'
          SYNC_MANIFEST_FILE: /tmp/validacion_compra_agil.txt
        shell: bash
        run: |
          # Un intento por esta validación: 504 ya se confirmó tres veces.
          if python scripts/sync_chilecompra_sheets.py; then
            echo "status=completo" >> "$GITHUB_OUTPUT"
          else
            echo "status=pendiente" >> "$GITHUB_OUTPUT"
            echo "::warning title=Compra Ágil pendiente::La API falló; se continúa con licitaciones"
            exit 1
          fi
      - name: Detalle de licitaciones (máximo 5)
        env:
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_OFFSET: '0'
          DETAIL_MAX_CODES: '5'
          DETAIL_MANIFEST_FILE: /tmp/validacion_licitaciones.txt
        run: python scripts/enriquecer_licitaciones.py
      - name: Ofertas y resultados Compra Ágil (máximo 5 procesos)
        env:
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_OFFSET: '0'
          DETAIL_MAX_CODES: '5'
          DETAIL_MANIFEST_FILE: /tmp/validacion_compra_agil.txt
        if: steps.agile.outcome == 'success'
        continue-on-error: true
        run: python scripts/etl_multiproceso_manual.py
      - name: Registrar cobertura y pendientes de la prueba
        shell: bash
        run: |
          mkdir -p data
          python - <<'PY'
          import json,os,datetime
          payload={"fecha_publicacion":os.environ["SYNC_FECHA_2026"],
                   "tipo":"validacion_controlada",
                   "licitaciones":"procesos_recuperados; detalle requiere revisión de logs",
                   "compra_agil":"${{ steps.agile.outcome }}",
                   "completitud":"parcial" if "${{ steps.agile.outcome }}"!="success" else "sujeta_a_validacion",
                   "nota":"La publicación no certifica cobertura completa de ofertas ni adjudicaciones"}
          with open("data/estado_cobertura.json","w",encoding="utf-8") as out:json.dump(payload,out,ensure_ascii=False,indent=2)
          print("COBERTURA",json.dumps(payload,ensure_ascii=False))
          PY
      - name: Exportar Google Sheets a JSON público
        run: python scripts/publicar_observatorio.py
      - name: Publicar con cobertura explícita (parcial si Compra Ágil falló)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json data/estado_cobertura.json
          if ! git diff --cached --quiet; then
            git commit -m "data: validación integral del Observatorio"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
