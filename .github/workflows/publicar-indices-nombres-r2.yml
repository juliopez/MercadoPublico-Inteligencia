name: Publicar indices privados de nombres en R2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: observatorio-indices-nombres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar credenciales de R2
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$R2_ACCOUNT_ID" || { echo "Faltan secretos R2"; exit 1; }
      - name: Generar indices historicos aislados
        run: node scripts/asistente_ia/backend/generar_historico_nombres.mjs "$PWD/frontend-v2" "$RUNNER_TEMP/indices-nombres"
      - name: Validar cobertura de cada mes
        run: |
          node --input-type=module -e '
          import {readFile} from "node:fs/promises";
          import {join} from "node:path";
          const c=JSON.parse(await readFile("frontend-v2/data/catalogo-publico.json","utf8"));
          for(const p of c.periodos) {
            const m=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,"indices-nombres",p.periodo,"manifiesto.json"),"utf8"));
            const esperado=["ofertas","resultados","ordenescompra"].reduce((a,e)=>a+p.conteos[e],0);
            if(m.registros_origen!==esperado) throw Error("Cobertura incorrecta "+p.periodo);
          }'
      - name: Instalar AWS CLI
        run: python -m pip install --user awscli
      - name: Publicar solo indices de búsqueda en bucket privado
        run: |
          aws s3 sync "$RUNNER_TEMP/indices-nombres/" "s3://$R2_BUCKET/indices-nombres/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --exclude "*" --include "*/clave-*.ndjson" --include "*/manifiesto.json" \
            --no-progress
