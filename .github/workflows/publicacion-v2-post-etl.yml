name: Publicacion V2 posterior al ETL Ubuntu
# Se reutiliza también para publicar enriquecimientos API validados.
on:
  workflow_run:
    workflows: ['Licitaciones API 16:15 - remoto']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'frontend-v2/data/catalogo-publico.json'
      # Un fragmento que llega después del catálogo también debe activar la reparación.
      - 'frontend-v2/data/partes/**'
      - '.github/workflows/publicacion-v2-post-etl.yml'
  schedule:
    # Disparos UTC para 17:00 Santiago en verano e invierno
    - cron: '0,15,30,45 20,21 * * 1-5'
  workflow_dispatch: # invocado también tras cargas API nocturnas
permissions:
  contents: write
concurrency:
  group: publicacion-v2-post-etl
  cancel-in-progress: false
jobs:
  actualizar-derivados:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Leer main actualizado incluso al reintentar una ejecución iniciada
          # antes de incorporar fragmentos faltantes al repositorio.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar validar y publicar derivados con reintentos seguros
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          export ORIGIN_OUTPUT="$RUNNER_TEMP/mer-origin.txt"
          # Every attempt starts from a fresh remote snapshot. Never force-push.
          for ATTEMPT in 1 2 3 4 5; do
            export ATTEMPT
            git fetch origin main
            git reset --hard origin/main
            BASE="$(git rev-parse HEAD)"
            echo "PUBLICACION_INTENTO $ATTEMPT base=$BASE"
            : > "$ORIGIN_OUTPUT"
          python - <<'PY'
          import datetime,json,os,pathlib,subprocess
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("America/Santiago"))
          catalog=json.loads(pathlib.Path("frontend-v2/data/catalogo-publico.json").read_text())
          private=json.loads(pathlib.Path("config/catalogo_sheets.json").read_text())
          source=catalog.get("ultima_exportacion") or {}
          period=source.get("periodo") or f"{now:%Y-%m}"
          active=[p for p,d in private["periodos"].items() if d.get("tipo")=="operativo"]
          if len(active)!=1:raise SystemExit("BLOQUEO: catálogo con mes operativo ambiguo")
          if period not in private["periodos"]:raise SystemExit("BLOQUEO: mes de exportación no catalogado")
          # La conciliación 09:00 exporta varios meses autorizados en una sola
          # transacción; ultima_exportacion solo identifica el último de ellos.
          path="frontend-v2/data/catalogo-publico.json"
          export_commit=subprocess.check_output(["git","log","-1","--format=%H","--",path],text=True).strip()
          subject=subprocess.check_output(["git","show","-s","--format=%s",export_commit],text=True).strip()
          author=subprocess.check_output(["git","show","-s","--format=%an",export_commit],text=True).strip()
          reconciliation=subject=="data(v2): conciliacion cronologica MER" and author=="MER Ubuntu Conciliacion"
          targets=[period]
          if reconciliation:
              # Regenerar todos los períodos cuyos fragmentos cambiaron, incluso
              # si el número de filas no cambió. No autorizar períodos desconocidos.
              import re
              files=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",export_commit],text=True).splitlines()
              affected={m.group(1) for f in files if (m:=re.match(r"frontend-v2/data/(?:partes/[^/]+/|analitica/)(20[0-9]{2}-[0-9]{2})/",f))}
              targets=sorted(affected|{period})
              public_periods={x["periodo"] for x in catalog["periodos"]}
              if any(p not in public_periods or p not in private["periodos"] or private["periodos"][p].get("tipo") not in ("operativo","historico") for p in targets):
                  raise SystemExit("BLOQUEO: conciliación con períodos no catalogados")
              print("CONCILIACION_PERIODOS_AUTORIZADOS",targets)
          elif period!=active[0] and private["periodos"][period].get("estado")!="cierre_operativo_pendiente_conciliacion_oficial":
              raise SystemExit("BLOQUEO: período exportado ajeno al operativo o cierre excepcional")
          output=pathlib.Path(os.environ["ORIGIN_OUTPUT"])
          def done(valid,msg):
              with output.open("a") as f:f.write(f"ready={'true' if valid else 'false'}\nperiodo={period}\nperiodos={' '.join(targets)}\n")
              print(msg)
          if os.environ["EVENTO"]=="schedule" and os.environ["ATTEMPT"]=="1" and (now.weekday()>4 or now.hour!=17):
              done(False,"Fuera de las 17:00 Santiago");raise SystemExit(0)
          path="frontend-v2/data/catalogo-publico.json"
          if sum(x.get("periodo")==period for x in catalog["periodos"])!=1:
              done(False,"Mes vigente sin registro unico");raise SystemExit(0)
          last=subprocess.check_output(["git","log","-1","--format=%cI","--",path,"frontend-v2/data/vinculos-oc-verificados.json"],text=True).strip()
          timestamp=datetime.datetime.fromisoformat(last).astimezone(ZoneInfo("America/Santiago"))
          # Los eventos push pueden provenir de recuperaciones API por lotes,
          # conciliaciones matinales o cargas nocturnas. No bloquearlos por hora.
          # La puerta de frescura 16:00 se conserva solo para schedule.
          if os.environ["EVENTO"]=="schedule" and (timestamp.date()!=now.date() or timestamp.hour<16):
              done(False,"Sin exportacion fresca del dia posterior a las 16h para schedule");raise SystemExit(0)
          done(True,f"Origen listo {last}")
          PY
            if ! grep -qx 'ready=true' "$ORIGIN_OUTPUT"; then exit 0; fi
            PERIODOS="$(sed -n 's/^periodos=//p' "$ORIGIN_OUTPUT")"
            # Preserve historical periods selected on earlier attempts even if a new
            # operational export arrives during regeneration.
            PERIODOS="$(printf '%s\n' ${PERIODOS_ACUMULADOS:-} $PERIODOS | sort -u | xargs)"
            PERIODOS_ACUMULADOS="$PERIODOS"
            export PERIODOS
            python - <<'PY'
          import json,os,pathlib
          private=json.loads(pathlib.Path("config/catalogo_sheets.json").read_text())["periodos"]
          public=json.loads(pathlib.Path("frontend-v2/data/catalogo-publico.json").read_text())["periodos"]
          for p in os.environ["PERIODOS"].split():
              assert p in private and private[p]["tipo"] in ("operativo","historico")
              assert sum(x["periodo"]==p for x in public)==1
          PY
          set -euo pipefail
          python -m py_compile scripts/indexar_busqueda_frontend_v2.py scripts/generar_perfiles_v2.py scripts/generar_analitica_v2.py scripts/indexar_relaciones_frontend_v2.py scripts/indexar_relaciones_procesos_v2.py
          for PERIODO in $PERIODOS; do
          export PERIODO
          for entidad in procesos ordenescompra ofertas resultados; do
            python scripts/indexar_busqueda_frontend_v2.py --periodo "$PERIODO" --entidad "$entidad"
            python scripts/generar_perfiles_v2.py --periodo "$PERIODO" --entidad "$entidad"
            python scripts/generar_analitica_v2.py --periodo "$PERIODO" --entidad "$entidad"
          done
          python scripts/indexar_relaciones_frontend_v2.py --periodo "$PERIODO"
          python scripts/indexar_relaciones_procesos_v2.py --periodo "$PERIODO"
          python - <<'PY'
          import json,os,pathlib
          p=os.environ["PERIODO"];root=pathlib.Path("frontend-v2/data")
          catalog=json.loads((root/"catalogo-publico.json").read_text())
          entry=next(x for x in catalog["periodos"] if x["periodo"]==p)
          for entity in ("procesos","ordenescompra","ofertas","resultados"):
              n=entry["conteos"][entity]
              paths=entry["partes"][entity]
              assert sum(len(json.loads((root/rel.removeprefix("data/")).read_text())) for rel in paths)==n
              analytic=json.loads((root/"analitica"/p/(entity+".json")).read_text())
              assert analytic["registros"]==n
              assert 0<=analytic["registros_con_monto"]<=n
              assert analytic["monto_total_clp"]>=0
              if p=="2026-10" and entity=="procesos":
                  assert analytic["registros_con_monto"]>=794, "Regresion de cobertura CLP octubre"
              assert json.loads((root/"perfiles"/p/entity/"meta.json").read_text())["registros"]==n
              assert json.loads((root/"busqueda"/p/entity/"meta.json").read_text())["conteo"]==n
          assert json.loads((root/"relaciones-procesos"/p/"meta.json").read_text())["registros"]==entry["conteos"]["procesos"]
          print("DERIVADOS_VERIFICADOS",p)
          PY
          done
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for PERIODO in $PERIODOS; do
          git add "frontend-v2/data/busqueda/$PERIODO/" "frontend-v2/data/perfiles/$PERIODO/" "frontend-v2/data/analitica/$PERIODO/" "frontend-v2/data/relaciones-procesos/$PERIODO/" "frontend-v2/data/indices/$PERIODO.json"
          git add -u "frontend-v2/data/busqueda/$PERIODO/" "frontend-v2/data/perfiles/$PERIODO/" "frontend-v2/data/analitica/$PERIODO/" "frontend-v2/data/relaciones-procesos/$PERIODO/"
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE" ]]; then echo "SIN_CAMBIOS_DERIVADOS"; exit 0; fi
            echo "MAIN_CAMBIO_SIN_DERIVADOS"; sleep "$((10*ATTEMPT))"; continue
          fi
          git commit -m "data(v2): actualizar indices y agregados $PERIODOS"
          
            if git push origin main; then
              echo "DERIVADOS_PUBLICADOS intento=$ATTEMPT"
              exit 0
            fi
            # If the server accepted the push but the response was lost, the next
            # snapshot will detect no changes. Never rebase stale generated artifacts.
            echo "PUBLICACION_REINTENTO intento=$ATTEMPT"
            if [[ "$ATTEMPT" != 5 ]]; then sleep "$((10*ATTEMPT))"; fi
          done
          echo "::error::PUBLICACION_AGOTADA tras cinco intentos"
          exit 1
