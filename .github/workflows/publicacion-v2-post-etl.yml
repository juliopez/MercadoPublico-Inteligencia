name: Publicacion V2 posterior al ETL Ubuntu
on:
  push:
    branches: [main]
    paths:
      - 'frontend-v2/data/catalogo-publico.json'
      - '.github/workflows/publicacion-v2-post-etl.yml'
  schedule:
    # Disparos UTC para 17:00 Santiago en verano e invierno
    - cron: '0,15,30,45 20,21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicacion-v2-post-etl
  cancel-in-progress: false
jobs:
  actualizar-derivados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar exportacion nueva y hora de Santiago
        id: origen
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,subprocess
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("America/Santiago"))
          period=f"{now:%Y-%m}"
          output=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          def done(valid,msg):
              with output.open("a") as f:f.write(f"ready={'true' if valid else 'false'}\nperiodo={period}\n")
              print(msg)
          if os.environ["EVENTO"]=="schedule" and (now.weekday()>4 or now.hour!=17):
              done(False,"Fuera de las 17:00 Santiago");raise SystemExit(0)
          path="frontend-v2/data/catalogo-publico.json"
          catalog=json.loads(pathlib.Path(path).read_text())
          if sum(x.get("periodo")==period for x in catalog["periodos"])!=1:
              done(False,"Mes vigente sin registro unico");raise SystemExit(0)
          last=subprocess.check_output(["git","log","-1","--format=%cI","--",path,"frontend-v2/data/vinculos-oc-verificados.json"],text=True).strip()
          timestamp=datetime.datetime.fromisoformat(last).astimezone(ZoneInfo("America/Santiago"))
          if timestamp.date()!=now.date() or timestamp.hour<16:
              done(False,"No hay exportacion fresca del dia posterior a las 16h");raise SystemExit(0)
          done(True,f"Origen listo {last}")
          PY
      - name: Generar índices, perfiles y analítica del mes operativo
        if: steps.origen.outputs.ready == 'true'
        env:
          PERIODO: ${{ steps.origen.outputs.periodo }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/indexar_busqueda_frontend_v2.py scripts/generar_perfiles_v2.py scripts/generar_analitica_v2.py scripts/indexar_relaciones_frontend_v2.py scripts/indexar_relaciones_procesos_v2.py
          for entidad in procesos ordenescompra ofertas resultados; do
            python scripts/indexar_busqueda_frontend_v2.py --periodo "$PERIODO" --entidad "$entidad"
            python scripts/generar_perfiles_v2.py --periodo "$PERIODO" --entidad "$entidad"
            python scripts/generar_analitica_v2.py --periodo "$PERIODO" --entidad "$entidad"
          done
          python scripts/indexar_relaciones_frontend_v2.py --periodo "$PERIODO"
          python scripts/indexar_relaciones_procesos_v2.py --periodo "$PERIODO"
          python - <<'PY'
          import json,os,pathlib
          p=os.environ["PERIODO"];root=pathlib.Path("frontend-v2/data")
          catalog=json.loads((root/"catalogo-publico.json").read_text())
          entry=next(x for x in catalog["periodos"] if x["periodo"]==p)
          for entity in ("procesos","ordenescompra","ofertas","resultados"):
              n=entry["conteos"][entity]
              paths=entry["partes"][entity]
              assert sum(len(json.loads((root/rel.removeprefix("data/")).read_text())) for rel in paths)==n
              analytic=json.loads((root/"analitica"/p/(entity+".json")).read_text())
              assert analytic["registros"]==n
              assert 0<=analytic["registros_con_monto"]<=n
              assert analytic["monto_total_clp"]>=0
              if p=="2026-10" and entity=="procesos":
                  assert analytic["registros_con_monto"]>=794, "Regresion de cobertura CLP octubre"
              assert json.loads((root/"perfiles"/p/entity/"meta.json").read_text())["registros"]==n
              assert json.loads((root/"busqueda"/p/entity/"meta.json").read_text())["conteo"]==n
          assert json.loads((root/"relaciones-procesos"/p/"meta.json").read_text())["registros"]==entry["conteos"]["procesos"]
          print("DERIVADOS_VERIFICADOS",p)
          PY
      - name: Publicar derivados solamente al pasar validaciones
        if: steps.origen.outputs.ready == 'true'
        env:
          PERIODO: ${{ steps.origen.outputs.periodo }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "frontend-v2/data/busqueda/$PERIODO/" "frontend-v2/data/perfiles/$PERIODO/" "frontend-v2/data/analitica/$PERIODO/" "frontend-v2/data/relaciones-procesos/$PERIODO/" "frontend-v2/data/indices/$PERIODO.json"
          git add -u "frontend-v2/data/busqueda/$PERIODO/" "frontend-v2/data/perfiles/$PERIODO/" "frontend-v2/data/analitica/$PERIODO/" "frontend-v2/data/relaciones-procesos/$PERIODO/"
          git diff --cached --check
          if git diff --cached --quiet; then echo "SIN_CAMBIOS_DERIVADOS";exit 0;fi
          git commit -m "data(v2): actualizar indices y agregados $PERIODO"
          git pull --rebase origin main
          git push origin main
          echo "DERIVADOS_PUBLICADOS"
