name: Compra Agil diaria 400 - cierre nocturno
on:
  schedule:
    # 22:05 Santiago: UTC-3 (verano) => 01:05 UTC, UTC-4 (invierno) => 02:05 UTC.
    # Dos horarios UTC por horario de verano/invierno; checkpoints y concurrency
    # garantizan reanudación sin repetir detalles ya confirmados si ambos corren.
    # Las ejecuciones retrasadas (incluso después de medianoche) son admitidas
    # hasta las 04:59 de Chile para la jornada que empezó la víspera a las 22.
    - cron: '5 1 * * *'
    - cron: '5 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mer-api-actions-unica
  cancel-in-progress: false
jobs:
  jornada:
    runs-on: ubuntu-latest
    timeout-minutes: 540
    env:
      CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
      MER_API_DELAY_SECONDS: "10"
      MER_API_MAX_DETAIL: "400"
      MER_API_RUN_NOW: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validar inicio nocturno Chile (incluye retrasos del schedule)
        id: ventana
        run: |
          # 22:00-04:59 Santiago, con objetivo del día hábil que comenzó a las 22h.
          # Si GitHub lanza a las 02:30, corresponde al día ANTERIOR, no a hoy.
          python scripts/ventana_api_nocturna.py
      - uses: actions/setup-python@v5
        if: steps.ventana.outputs.ok == 'true'
        with:
          python-version: '3.11'
      - name: Dependencias y preflight
        if: steps.ventana.outputs.ok == 'true'
        run: |
          set -euo pipefail
          test -n "$CHILECOMPRA_TICKET"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          python -m pip install --disable-pip-version-check 'gspread>=6,<7' 'google-auth>=2,<3'
          python -m py_compile scripts/mer_api_actions_diaria.py
          python - <<'PY'
          import json,os
          c=json.load(open('config/catalogo_sheets.json'))
          p=os.environ['PERIODO_SOLICITADO']
          assert c['periodos'][p]['tipo']=='operativo', 'Sólo mes operativo vigente'
          PY
      - name: Configurar identidad Git para rebase de checkpoints y publicación
        if: steps.ventana.outputs.ok == 'true'
        run: |
          git config user.name 'MER API Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Ejecutar lotes y guardar checkpoints sin repetir detalles
        if: steps.ventana.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for indice in $(seq 1 12); do
            # No iniciar un nuevo lote cuya ejecución promedio sobrepase las 07:00.
            if ! python - <<'PY'
          import datetime
          from zoneinfo import ZoneInfo
          n=datetime.datetime.now(ZoneInfo('America/Santiago'))
          assert n.hour>=22 or n.hour<5, 'Fin de ventana de nuevos lotes'
          PY
            then break; fi
            export MER_API_RUN_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${indice}"
            python scripts/mer_api_actions_diaria.py
            python - <<'PY'
          import json,os
          r=json.load(open('control/ultimo_reporte_api_mer.json'))
          assert r.get('id_ejecucion')==os.environ['MER_API_RUN_ID'], 'Reporte desfasado'
          assert r.get('fecha_objetivo')==os.environ['MER_API_FECHA_OBJETIVO'], 'Jornada distinta'
          print('CHECKPOINT',r,flush=True)
          PY
            git add control/cola_api_mer.json control/ultimo_reporte_api_mer.json
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git -c user.name='MER API Actions' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data(api): jornada $MER_API_FECHA_OBJETIVO lote $indice"
              # Rebasar sobre publicaciones concurrentes sin sobrescribir cambios.
              # Ante conflicto de contenido, abortar y conservar el artifact.
              publicado=0
              for intento in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo 'ERROR: conflicto de contenido al rebasar checkpoint; estado conservado en artifact'
                  exit 1
                fi
                if git push origin HEAD:main; then publicado=1; break; fi
                echo "PUSH_CONCURRENTE_REINTENTO $intento"
                sleep 5
              done
              if [ "$publicado" -ne 1 ]; then
                echo 'ERROR: main cambio durante tres intentos; estado conservado en artifact'
                exit 1
              fi
            fi
            # La revisión inicial de las 22h no cierra procesos que lleguen antes de las 23:59.
            if python - <<'PY'
          import json,os,datetime
          from zoneinfo import ZoneInfo
          s=json.load(open('control/cola_api_mer.json'))['jornadas_actions'][os.environ['MER_API_FECHA_OBJETIVO']]
          assert s.get('preliminar') and datetime.datetime.now(ZoneInfo('America/Santiago')).date().isoformat()==os.environ['MER_API_FECHA_OBJETIVO']
          PY
            then
              echo 'LISTADO_PRELIMINAR: esperar hasta pasada medianoche para revisar publicaciones tardias'
              python - <<'PY'
          import datetime,time
          from zoneinfo import ZoneInfo
          n=datetime.datetime.now(ZoneInfo('America/Santiago'))
          end=datetime.datetime.combine(n.date()+datetime.timedelta(days=1),datetime.time(0,3),tzinfo=ZoneInfo('America/Santiago'))
          time.sleep(max(0,(end-n).total_seconds()))
          PY
              python - <<'PY'
          import json,os
          p='control/cola_api_mer.json'
          j=json.load(open(p))
          v=j['jornadas_actions'][os.environ['MER_API_FECHA_OBJETIVO']]
          v.pop('preliminar',None)
          v['pagina']=1
          with open(p,'w') as f:json.dump(j,f,ensure_ascii=False,indent=2)
          PY
            fi
            if python - <<'PY'
          import json,os
          s=json.load(open('control/cola_api_mer.json'))['jornadas_actions'][os.environ['MER_API_FECHA_OBJETIVO']]
          assert s.get('completa') is True
          PY
            then echo 'JORNADA_AGOTADA'; break; fi
            if python - <<'PY'
          import datetime,json,os
          from zoneinfo import ZoneInfo
          state=json.load(open('control/cola_api_mer.json'))['jornadas_actions'][os.environ['MER_API_FECHA_OBJETIVO']]
          pause=state.get('pausa_hasta')
          assert not pause or pause<=datetime.datetime.now(ZoneInfo('America/Santiago')).isoformat(), 'API en enfriamiento'
          PY
            then :; else echo 'CUOTA_API_ENFRIAMIENTO'; break; fi
          done
      - name: Resguardar estado aun ante falla
        if: always() && steps.ventana.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-dia-${{ github.run_id }}
          path: |
            control/cola_api_mer.json
            control/ultimo_reporte_api_mer.json
      - name: Exportar e indexar el mes operativo
        if: steps.ventana.outputs.ok == 'true' && success()
        run: |
          set -euo pipefail
          python scripts/exportar_mer_operativo_v2.py --periodo "$PERIODO_SOLICITADO" --aplicar --incluir-api
          for entidad in procesos ordenescompra ofertas resultados; do
            python scripts/indexar_busqueda_frontend_v2.py --periodo "$PERIODO_SOLICITADO" --entidad "$entidad"
            python scripts/generar_perfiles_v2.py --periodo "$PERIODO_SOLICITADO" --entidad "$entidad"
            python scripts/generar_analitica_v2.py --periodo "$PERIODO_SOLICITADO" --entidad "$entidad"
          done
          python scripts/indexar_relaciones_frontend_v2.py --periodo "$PERIODO_SOLICITADO"
          python scripts/indexar_relaciones_procesos_v2.py --periodo "$PERIODO_SOLICITADO"
          git add frontend-v2/data/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='MER API Actions' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data(api): publicar jornada $MER_API_FECHA_OBJETIVO"
            publicado=0
            for intento in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'CONFLICTO: cambios de contenido incompatibles; no sobrescribir'
                exit 1
              fi
              if git push origin HEAD:main; then publicado=1; break; fi
              echo "PUBLICACION_CONCURRENTE_REINTENTO $intento"
              sleep 5
            done
            if [ "$publicado" -ne 1 ]; then
              echo 'CONFLICTO: publicación cancelada tras tres intentos'
              exit 1
            fi
          fi
      - name: Desplegar y verificar Pages
        if: steps.ventana.outputs.ok == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          export BEFORE="$(gh run list --workflow preview-frontend-v2.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run preview-frontend-v2.yml --ref main
          run_id=""
          for i in $(seq 1 40); do
            run_id="$(gh run list --workflow preview-frontend-v2.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$run_id" != "$BEFORE" ] && [ "$run_id" != 0 ]; then break; fi
            sleep 15
          done
          if [ "$run_id" = "$BEFORE" ] || [ "$run_id" = 0 ]; then echo 'ERROR: no se encontró deploy Pages'; exit 1; fi
          gh run watch "$run_id" --exit-status
          python - <<'PY'
          import json,os,time,urllib.request
          p=os.environ['PERIODO_SOLICITADO']
          wanted=json.load(open('frontend-v2/data/catalogo-publico.json'))
          expected=next(x['conteos'] for x in wanted['periodos'] if x['periodo']==p)
          url='https://juliopez.github.io/MercadoPublico-Inteligencia/frontend-v2/data/catalogo-publico.json'
          for i in range(12):
           try:
            q=urllib.request.Request(url+'?verificacion='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            live=json.load(urllib.request.urlopen(q,timeout=25))
            entry=next(x for x in live['periodos'] if x['periodo']==p)
            if entry['conteos']==expected:
             print('PAGES_VERIFICADO',p,expected,flush=True)
             break
           except Exception as exc: print('PAGES_REINTENTO',type(exc).__name__,flush=True)
           time.sleep(20)
          else:raise SystemExit('ERROR: Pages no corresponde al catálogo publicado')
          PY
