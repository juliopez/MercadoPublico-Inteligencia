name: Extraer ofertas piloto
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar ofertas de Compra Agil
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/extraer_ofertas_piloto.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ofertas-piloto
          path: output/ofertas/
          retention-days: 1
