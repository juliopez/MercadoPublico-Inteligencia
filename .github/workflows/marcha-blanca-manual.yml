name: Marcha blanca - operaciones manuales
on:
  workflow_dispatch:
    inputs:
      operacion:
        description: "Proceso que se desea ejecutar"
        required: true
        type: choice
        options:
          - licitaciones
          - compra_agil
          - ordenes_compra
          - publicar
          - completa
      fecha:
        description: "Fecha obligatoria de los datos (AAAA-MM-DD)"
        required: true
        type: string
      categoria_compra_agil:
        description: "Rubro/temática (filtro textual; solo Compra Ágil)"
        required: true
        type: choice
        default: "Todas"
        options:
          - "Todas"
          - "Capacitación"
          - "Computación"
          - "Software"
          - "Asesoría"
          - "Consultoría"
          - "Equipamiento"
          - "Mantención"
          - "Servicios"
          - "Insumos médicos"
          - "Educación, formación, entrenamiento y capacitación"
          - "Tecnologías de la información, telecomunicaciones y radiodifusión"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: marcha-blanca-observatorio
  cancel-in-progress: false
jobs:
  ejecutar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Definir fecha
        env:
          FECHA: ${{ inputs.fecha }}
        shell: bash
        run: |
          fecha="$FECHA"
          if ! [[ "$fecha" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Fecha inválida (AAAA-MM-DD)"; exit 1
          fi
          if ! date -u -d "$fecha" +%F >/dev/null 2>&1 || [[ "$(date -u -d "$fecha" +%F)" != "$fecha" ]]; then
            echo "::error::Fecha inexistente"; exit 1
          fi
          if [[ "$fecha" > "$(TZ=America/Santiago date +%F)" ]]; then
            echo "::error::La fecha no puede ser futura en Chile"; exit 1
          fi
          echo "SYNC_FECHA_2026=$fecha" >> "$GITHUB_ENV"
      - name: Ejecutar ETL seleccionados (máximo tres intentos por componente)
        if: ${{ inputs.operacion != 'publicar' }}
        shell: bash
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          API_MAX_ATTEMPTS: '1'
          SYNC_MAX_PAGES: '1000'
          OP: ${{ inputs.operacion }}
          COMPRA_AGIL_CATEGORIA: ${{ inputs.categoria_compra_agil == 'Todas' && '' || inputs.categoria_compra_agil }}
        run: |
          set -uo pipefail
          if [[ -n "$COMPRA_AGIL_CATEGORIA" && "$COMPRA_AGIL_CATEGORIA" != "Todas" && "$OP" != "compra_agil" ]]; then
            echo "::error::La categoría manual solo está disponible para compra_agil."
            exit 1
          fi
          run_etl() {
            local label="$1"; shift
            local ok=1
            for attempt in 1 2 3; do
              echo "::notice::$label - intento $attempt/3 - $SYNC_FECHA_2026"
              if "$@"; then ok=0; break; fi
              if [[ -f .api_rate_limited ]]; then
                echo "::error::ChileCompra respondió HTTP 429. Lote detenido; sin nuevos intentos ni categorías adicionales."
                cat .api_rate_limited
                exit 1
              fi
              if [[ $attempt -lt 3 ]]; then sleep 45; fi
            done
            if [[ $ok -ne 0 ]]; then
              echo "::error::$label falló tras tres intentos. Reejecutar manualmente la misma fecha."
              return 1
            fi
            return 0
          }
          if [[ "$OP" == "licitaciones" || "$OP" == "completa" ]]; then
            run_etl licitaciones env SYNC_MODALIDAD=licitaciones python3 scripts/sync_chilecompra_sheets.py || exit 1
          fi
          if [[ "$OP" == "licitaciones" || "$OP" == "completa" ]]; then
            run_etl licitaciones_resultados python3 scripts/sync_resultados_licitaciones.py || exit 1
          fi
          if [[ "$OP" == "compra_agil" || "$OP" == "completa" ]]; then
            run_etl compra_agil env SYNC_MODALIDAD=compra_agil python3 scripts/sync_chilecompra_sheets.py || exit 1
          fi
          if [[ "$OP" == "compra_agil" || "$OP" == "completa" ]]; then
            run_etl compra_agil_detalle env DETAIL_FECHA="$SYNC_FECHA_2026" DETAIL_MAX_CODES=1000000 DETAIL_DELAY_SECONDS=0.25 python3 scripts/etl_multiproceso_manual.py || exit 1
          fi
          if [[ "$OP" == "ordenes_compra" || "$OP" == "completa" ]]; then
            run_etl ordenes_compra python3 scripts/sync_ordenes_compra_sheets.py || exit 1
          fi
      - name: Generar extracto público desde Google Sheets
        if: ${{ inputs.operacion == 'publicar' || inputs.operacion == 'completa' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/publicar_observatorio.py
      - name: Guardar datos publicados
        if: ${{ inputs.operacion == 'publicar' || inputs.operacion == 'completa' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publicación manual observatorio"
            git pull --rebase
            git push
          fi
      - name: Configurar Pages
        if: ${{ inputs.operacion == 'publicar' || inputs.operacion == 'completa' }}
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        if: ${{ inputs.operacion == 'publicar' || inputs.operacion == 'completa' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Desplegar Pages
        if: ${{ inputs.operacion == 'publicar' || inputs.operacion == 'completa' }}
        uses: actions/deploy-pages@v4
