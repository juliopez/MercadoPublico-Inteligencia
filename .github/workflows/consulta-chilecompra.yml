name: Validar API ChileCompra
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar procesos de Compra Ágil
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/consulta_compra_agil.py
      - name: Conservar resultados solo como artefacto de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consulta-compra-agil
          path: output/consulta/
          if-no-files-found: warn
          retention-days: 1
