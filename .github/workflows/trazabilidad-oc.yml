name: Verificar trazabilidad de OC
on:
  workflow_dispatch:
    inputs:
      codigo_oc_publico:
        description: 'Codigo publico de OC obtenido de fuente oficial (no id interno)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  trazabilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verificar codigo publico de OC
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          CODIGO_OC_PUBLICO: ${{ inputs.codigo_oc_publico }}
        run: python3 scripts/trazabilidad_oc.py
      - uses: actions/upload-artifact@v4
        with:
          name: trazabilidad-oc
          path: output/trazabilidad/trazabilidad.json
          retention-days: 1
