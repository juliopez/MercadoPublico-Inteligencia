name: Generar analítica mensual V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generar-analitica-v2.yml'
      - 'scripts/generar_analitica_v2.py'
      - 'scripts/asistente_ia/backend/sincronizar_analitica_v2.py'
      - 'frontend-v2/data/catalogo-publico.json'
      - 'frontend-v2/data/partes/**'
permissions:
  contents: write
concurrency:
  group: analitica-v2
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis
        run: |
          python -m py_compile scripts/generar_analitica_v2.py scripts/asistente_ia/backend/sincronizar_analitica_v2.py
          node --check frontend-v2/js/analitica-visual.js
          node --check frontend-v2/js/app.js
      - name: Regenerar solo agregados desfasados y verificar todos los períodos
        run: |
          set -euo pipefail
          python scripts/asistente_ia/backend/sincronizar_analitica_v2.py
      - name: Publicar derivados solo si las fuentes no cambiaron
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend-v2/data/analitica
          if git diff --cached --quiet; then
            echo "ANALITICA_SIN_CAMBIOS"
            exit 0
          fi
          # Nunca publicar agregados calculados contra un catálogo anterior.
          BASE_CATALOGO="$(git rev-parse HEAD:frontend-v2/data/catalogo-publico.json)"
          git fetch origin main
          ACTUAL_CATALOGO="$(git rev-parse origin/main:frontend-v2/data/catalogo-publico.json)"
          if [ "$BASE_CATALOGO" != "$ACTUAL_CATALOGO" ]; then
            echo "BLOQUEADO: catálogo cambió durante la generación; esperar nueva ejecución"
            exit 1
          fi
          git commit -m "data(v2): sincronizar agregados analíticos con catálogo"
          git pull --rebase origin main
          git push origin HEAD:main
