name: Carga nocturna puntual 15 octubre 2026
on:
  schedule:
    - cron: '0 7 17 10 *' # 04:00 America/Santiago el 17-10-2026 (UTC-3)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carga-nocturna-chilecompra-2026-10-15
  cancel-in-progress: false
jobs:
  cargar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 17 10 *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      SYNC_FECHA_2026: '2026-10-15'
      API_MAX_ATTEMPTS: '1'
      SYNC_MAX_PAGES: '1000'
      COMPRA_AGIL_CATEGORIA: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar ventana puntual y año
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [[ "$EVENTO" == "schedule" && "$(TZ=America/Santiago date +%F)" != "2026-10-17" ]]; then
            echo "::notice::Fecha distinta del único día autorizado; sin consultas."
            echo "SKIP_CARGA=1" >> "$GITHUB_ENV"
          fi
      - name: Instalar dependencias
        if: ${{ env.SKIP_CARGA != '1' }}
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Ejecutar tres categorías con recuperación parcial
        if: ${{ env.SKIP_CARGA != '1' }}
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          run_etl() {
            local label="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              echo "::notice::$label intento $attempt/3 para $SYNC_FECHA_2026"
              if "$@"; then
                echo "OK $label"
                return 0
              fi
              if [[ -f .api_rate_limited ]]; then
                echo "::error::HTTP 429 en $label; detener todas las consultas nocturnas."
                cat .api_rate_limited
                exit 75
              fi
              if [[ $attempt -lt 3 ]]; then sleep 45; fi
            done
            echo "::warning::$label agotó tres intentos"
            return 1
          }
          echo "=== Licitaciones ==="
          if run_etl licitaciones env SYNC_MODALIDAD=licitaciones python3 scripts/sync_chilecompra_sheets.py; then
            run_etl licitaciones_resultados python3 scripts/sync_resultados_licitaciones.py || errors=$((errors+1))
          else
            errors=$((errors+1))
          fi
          echo "=== Compra Ágil (sin filtro) ==="
          if run_etl compra_agil env SYNC_MODALIDAD=compra_agil python3 scripts/sync_chilecompra_sheets.py; then
            run_etl compra_agil_detalle env DETAIL_FECHA="$SYNC_FECHA_2026" DETAIL_MAX_CODES=1000000 DETAIL_DELAY_SECONDS=0.25 python3 scripts/etl_multiproceso_manual.py || errors=$((errors+1))
          else
            errors=$((errors+1))
          fi
          echo "=== Órdenes de compra ==="
          run_etl ordenes_compra python3 scripts/sync_ordenes_compra_sheets.py || errors=$((errors+1))
          echo "RESUMEN_NOCTURNO errores_componentes=$errors fecha=$SYNC_FECHA_2026"
          if [[ "$errors" -gt 0 ]]; then exit 1; fi
