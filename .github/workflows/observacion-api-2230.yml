name: API ChileCompra - observacion diaria 22h30 Chile
on:
  schedule:
    # 22:30 Chile: UTC 01:30 en horario de verano, UTC 02:30 en invierno.
    - cron: '30 1,2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mer-api-observacion-nocturna
  cancel-in-progress: false
jobs:
  lote-acotado:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar criptografia
        run: python -m pip install 'cryptography>=42,<47'
      - name: Consultar API en ventana nocturna de Santiago
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python scripts/observacion_api_2230.py
      - name: Guardar respuesta cifrada y estado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mer-api-observacion-cifrada
          path: ${{ runner.temp }}/reporte-api-2230.json
          retention-days: 7
          if-no-files-found: ignore
