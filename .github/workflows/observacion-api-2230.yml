name: API ChileCompra - MER tres tablas 22h30 Chile
on:
  schedule:
    - cron: '30 1,2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mer-api-nocturno
  cancel-in-progress: false
jobs:
  lote-acotado:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gspread>=6,<7' 'google-auth>=2,<3'
      - name: Actualizar Procesos, Ofertas y Resultados
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MER_API_MAX_DETAIL: '2'
        run: python scripts/sincronizar_tres_tablas_api_2230.py
