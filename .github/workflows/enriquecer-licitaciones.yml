name: Enriquecer detalle de licitaciones
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de publicación (opcional, AAAA-MM-DD)'
        type: string
        required: false
      desde_indice:
        description: 'Inicio de lote'
        type: number
        default: 0
      max_codigos:
        description: 'Tamaño de lote (1 a 100)'
        type: number
        default: 10
permissions:
  contents: read
concurrency:
  group: detalle-licitaciones
  cancel-in-progress: false
jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Consultar detalle sin inferir ofertas ni adjudicaciones
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_OFFSET: ${{ inputs.desde_indice }}
          DETAIL_MAX_CODES: ${{ inputs.max_codigos }}
          API_MAX_ATTEMPTS: '1'
        run: python3 scripts/enriquecer_licitaciones.py
