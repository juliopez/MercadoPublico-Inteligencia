name: Validar ETL ZIP por fuente (sin escrituras)
on:
  push:
    paths:
      - 'scripts/etl_zip_dos_fuentes.py'
      - 'scripts/importador_historicos_v2.py'
      - 'tests/test_etl_fuentes_independientes.py'
      - '.github/workflows/validar-etl-fuentes-independientes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas-aisladas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar ETL y bitácora
        run: python -m py_compile scripts/etl_zip_dos_fuentes.py scripts/registrar_sincronizacion.py tests/test_etl_fuentes_independientes.py
      - name: Probar escenarios con ZIP sintéticos, sin red ni credenciales
        run: python -m unittest discover -s tests -p 'test_etl_fuentes_independientes.py' -v
