name: Cargar diez procesos controlados
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etl-manual-procesos
  cancel-in-progress: false
jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Sincronizar lote fijo y verificar duplicados
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/etl_escritura_10.py
