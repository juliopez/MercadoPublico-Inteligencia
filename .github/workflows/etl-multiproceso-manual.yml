name: ETL multiproceso manual
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de publicación (AAAA-MM-DD), vacío = primeros procesos disponibles'
        type: string
        required: false
      desde_indice:
        description: 'Desplazamiento inicial para continuar con el siguiente lote (0, 10, 20...)'
        type: number
        required: true
        default: 0
      max_codigos:
        description: 'Máximo de procesos a consultar (1-100)'
        type: number
        required: true
        default: 10
permissions:
  contents: read
concurrency:
  group: etl-ofertas-piloto
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Sincronizar resultados validos y registrar fallidos
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          DETAIL_FECHA: ${{ inputs.fecha }}
          DETAIL_MAX_CODES: ${{ inputs.max_codigos }}
          DETAIL_OFFSET: ${{ inputs.desde_indice }}
        run: python3 scripts/etl_multiproceso_manual.py
