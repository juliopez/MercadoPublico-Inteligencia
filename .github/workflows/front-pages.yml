name: Observatorio - despliegue exclusivo del front
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/front-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: observatorio-operacion-unica
  cancel-in-progress: false
jobs:
  publicar-front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Desplegar solo sitio existente
        id: deploy
        uses: actions/deploy-pages@v4
