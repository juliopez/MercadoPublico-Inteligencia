name: Reparar metadatos licitaciones 15-10-2026
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Corregir únicamente metadatos importados del listado diario
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python scripts/reparar_licitaciones_20261015.py
