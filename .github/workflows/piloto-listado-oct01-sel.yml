name: Piloto listado octubre 1 con seleccion
on:
  push:
    branches: [etapa2/escritor-prueba-20261028]
    paths:
      - '.github/workflows/piloto-listado-oct01-sel.yml'
permissions:
  contents: read
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=42,<47'
      - name: Consultar una página de seleccionadas y cifrar
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python scripts/piloto_listado_oct01_seleccionado_api_mer.py
      - uses: actions/upload-artifact@v4
        with:
          name: mer-api-listado-oct01-sel-cifrado
          path: ${{ runner.temp }}/listado_oct01_sel_cifrado.json
          retention-days: 7
          if-no-files-found: error
