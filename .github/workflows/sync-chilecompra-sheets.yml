name: Sincronizar ChileCompra a Google Sheets
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
permissions:
  contents: read
concurrency:
  group: sync-chilecompra-sheets
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check "gspread==6.2.1" "google-auth==2.40.3"
      - name: Sincronizar procesos con Google Sheets
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          SYNC_LOOKBACK_DAYS: '7'
          SYNC_MAX_PAGES: '20'
        run: python3 scripts/sync_chilecompra_sheets.py
