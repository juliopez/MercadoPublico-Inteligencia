name: Conciliar agosto CA OC V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/conciliar-agosto-ca-oc-v2.yml'
      - 'scripts/conciliar_agosto_ca_oc_v2.py'
permissions:
  contents: write
concurrency:
  group: conciliar-agosto-ca-oc-v2
  cancel-in-progress: false
jobs:
  conciliacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conciliación completa y verificaciones
        run: |
          set -euo pipefail
          python -m py_compile scripts/conciliar_agosto_ca_oc_v2.py
          python scripts/conciliar_agosto_ca_oc_v2.py
          python - <<'PY'
          import json
          r=json.load(open('frontend-v2/data/conciliacion/2026-08/resumen.json'))
          assert r['periodo']=='2026-08' and r['totales_fuente']['ordenescompra']==153221
          assert r['totales_fuente']['ofertas']==432111
          assert r['oc_candidatas_distintas'] <= r['totales_fuente']['ordenescompra']
          print('CONCILIACION_AGOSTO_VERIFICADA')
          PY
      - name: Publicar conciliación sin editar originales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-v2/data/conciliacion/2026-08/
          if ! git diff --cached --quiet; then
            git commit -m "data(v2): publicar conciliación masiva CA-OC agosto 2026"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
