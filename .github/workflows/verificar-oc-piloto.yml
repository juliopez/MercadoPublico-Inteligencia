name: Verificar motivo y OC piloto
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Contrastar motivo y referencia de OC
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/verificar_oc_piloto.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: evidencia-oc-piloto
          path: output/validacion_oc/
          retention-days: 1
          if-no-files-found: ignore
