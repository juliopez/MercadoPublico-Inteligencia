name: Verificar oficialmente relación CA OC V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verificar-oficial-ca-oc-v2.yml'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar dos códigos oficiales sin modificar datos
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: |
          python -m py_compile scripts/verificar_oficial_ca_oc_v2.py
          python scripts/verificar_oficial_ca_oc_v2.py
      - name: Registrar dictamen sin datos privados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditorias/VERIFICACION_OFICIAL_839-4-COT26_2026-10-21.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(v2): registrar resultado verificación oficial CA OC"
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
