name: V2 - ciclo conjunto controlado
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de publicaciones (AAAA-MM-DD)"
        required: true
        default: "auto"
        type: string
      tope_pagina:
        description: "Última página admisible para la fecha"
        default: "496"
        required: true
        type: string
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: observatorio-v2-pruebas
  cancel-in-progress: false
jobs:
  v2:
    # El temporizador permanece inactivo hasta configurar explícitamente esta variable.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.V2_AUTO_ACTIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de Google Sheets
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Ciclo V2 pequeño y persistente
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          FECHA: ${{ github.event_name == 'workflow_dispatch' && inputs.fecha || 'auto' }}
          TOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.tope_pagina || '496' }}
        run: python3 scripts/v2_ciclo_github.py --fecha "$FECHA" --tope-pagina "$TOPE" --max-paginas 1 --max-detalles 1
