name: Observatorio - vista previa frontend MER v2
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publicacion V2 posterior al ETL Ubuntu', 'Publicar participación histórica V2']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'frontend-v2/index.html'
      - 'frontend-v2/css/**'
      - 'frontend-v2/js/**'
      - 'frontend-v2/data/indices/**'
      - 'frontend-v2/data/relaciones-procesos/**'
      - 'frontend-v2/data/busqueda/**'
      - 'frontend-v2/data/perfiles/**'
      - 'frontend-v2/data/autocompletar/**'
      - 'frontend-v2/data/analitica/**'
      - 'frontend-v2/data/sugerencias/**'
      - '.github/workflows/preview-frontend-v2.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: observatorio-operacion-unica
  cancel-in-progress: false
jobs:
  vista-previa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}frontend-v2/
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis del JavaScript antes del despliegue
        run: |
          node --check frontend-v2/js/app.js
          node --check frontend-v2/js/analitica-visual.js
      - name: Validar catálogo, integridad de partes y aislamiento de v1
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('frontend-v2')
          assert (root/'index.html').is_file()
          assert (root/'js/app.js').is_file()
          m=json.loads((root/'data/catalogo-publico.json').read_text())
          assert m.get('version')=='2.0'
          for item in m.get('periodos',[]):
              for entity,paths in item.get('partes',{}).items():
                  total=0
                  for relative in paths:
                      p=root/relative
                      assert p.is_file(),str(p)
                      rows=json.loads(p.read_text())
                      assert isinstance(rows,list)
                      total+=len(rows)
                  assert total==item['conteos'][entity],(item['periodo'],entity,total)
          assert pathlib.Path('index.html').is_file()
          assert pathlib.Path('data/observatorio.json').is_file()
          a=json.loads((root/'data/analitica/2026-08/procesos.json').read_text())
          assert a['registros']==83937
          assert a.get('top_actores_monto') and a.get('modalidades'), 'Faltan agregados nuevos en Pages'
          # No desplegar Pages con un catalogo mas reciente que sus agregados.
          # El push de datos brutos activa primero la publicacion de derivados;
          # este workflow despliega despues de finalizar aquella ejecucion.
          for item in m.get('periodos',[]):
              p=item['periodo']
              data_file=root/'data'/'analitica'/p/'procesos.json'
              if not data_file.is_file():
                  raise AssertionError(f'Faltan agregados para {p}')
              detail=json.loads(data_file.read_text())
              expected=item['conteos']['procesos']
              assert detail['registros']==expected,(p,'analitica_desfasada',detail['registros'],expected)
              modes=detail.get('modalidades',[])
              if modes:
                  assert sum(int(row[1]) for row in modes)==expected,(p,'modalidades_desfasadas')
          print('PREVIEW_V2_INTEGRIDAD_OK')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Desplegar preview v2 manteniendo raíz v1
        id: deploy
        uses: actions/deploy-pages@v4
