name: Observatorio - vista previa frontend MER v2
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publicar participación histórica V2', 'Reparar analítica de organismos por período']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'frontend-v2/index.html'
      - 'frontend-v2/css/**'
      - 'frontend-v2/js/**'
      - 'frontend-v2/data/indices/**'
      - 'frontend-v2/data/relaciones-procesos/**'
      - 'frontend-v2/data/busqueda/**'
      - 'frontend-v2/data/perfiles/**'
      - 'frontend-v2/data/autocompletar/**'
      - 'frontend-v2/data/analitica/**'
      - 'frontend-v2/data/sugerencias/**'
      - '.github/workflows/preview-frontend-v2.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: observatorio-operacion-unica
  cancel-in-progress: false
jobs:
  vista-previa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}frontend-v2/
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run apunta al SHA que inició la reparación. Los nuevos
          # agregados se publican después, así que desplegar main vigente.
          ref: main
      - name: Comprobar sintaxis del JavaScript antes del despliegue
        run: |
          node --check frontend-v2/js/app.js
          node --check frontend-v2/js/analitica-visual.js
      - name: Validar catálogo, integridad de partes y aislamiento de v1
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('frontend-v2')
          assert (root/'index.html').is_file()
          assert (root/'js/app.js').is_file()
          m=json.loads((root/'data/catalogo-publico.json').read_text())
          assert m.get('version')=='2.0'
          for item in m.get('periodos',[]):
              for entity,paths in item.get('partes',{}).items():
                  total=0
                  for relative in paths:
                      p=root/relative
                      assert p.is_file(),str(p)
                      rows=json.loads(p.read_text())
                      assert isinstance(rows,list)
                      total+=len(rows)
                  assert total==item['conteos'][entity],(item['periodo'],entity,total)
          root_page=pathlib.Path('index.html')
          assert root_page.is_file()
          assert '<base href="./frontend-v2/">' in root_page.read_text(), 'La raíz debe apuntar a recursos V2'
          assert 'VERSION ESTABLE' not in root_page.read_text(), 'Revisar etiqueta de estabilidad desde la V2 fuente'
          assert pathlib.Path('historico/v1/index.html').is_file(), 'Falta respaldo fuente de V1'
          a=json.loads((root/'data/analitica/2026-08/procesos.json').read_text())
          assert a['registros']==83937
          assert a.get('top_actores_monto') and a.get('modalidades'), 'Faltan agregados nuevos en Pages'
          # No desplegar Pages con un catalogo mas reciente que sus agregados.
          # El push de datos brutos activa primero la publicacion de derivados;
          # este workflow despliega despues de finalizar aquella ejecucion.
          for item in m.get('periodos',[]):
              p=item['periodo']
              data_file=root/'data'/'analitica'/p/'procesos.json'
              if not data_file.is_file():
                  raise AssertionError(f'Faltan agregados para {p}')
              detail=json.loads(data_file.read_text())
              expected=item['conteos']['procesos']
              assert detail['registros']==expected,(p,'analitica_desfasada',detail['registros'],expected)
              modes=detail.get('modalidades',[])
              if modes:
                  assert sum(int(row[1]) for row in modes)==expected,(p,'modalidades_desfasadas')
          print('PREVIEW_V2_INTEGRIDAD_OK')
          PY
      - name: Construir sitio oficial V2 sin duplicar los datos históricos
        run: |
          set -euo pipefail
          mkdir -p _pages/frontend-v2 _pages/historico/v1
          python3 scripts/generar_portada_v2.py --origen frontend-v2/index.html --salida _pages/index.html
          cp -a frontend-v2/. _pages/frontend-v2/
          # La antigua URL V2 conserva compatibilidad, pero redirige a la raíz.
          cat > _pages/frontend-v2/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,follow">
          <meta http-equiv="refresh" content="0;url=../">
          <title>Observatorio de Mercado Público · Nueva dirección</title>
          <script>location.replace('../'+location.search+location.hash);</script>
          </head><body><p>El Observatorio ahora está en <a href="../">la página principal</a>.</p></body></html>
          HTML
          # V1 se conserva en GitHub como archivo, no se vuelve a publicar
          # su antigua copia pesada de datos ni se habilita su aplicación.
          cat > _pages/historico/v1/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Archivo histórico · Observatorio V1</title></head>
          <body style="font:16px system-ui,sans-serif;max-width:750px;margin:12vh auto;padding:24px;color:#183149">
          <h1>Observatorio V1 · Archivo histórico</h1>
          <p>La primera versión fue una prueba de concepto. No recibe actualizaciones y no es la plataforma vigente.</p>
          <p>El código de esa versión se conserva en el <a href="https://github.com/juliopez/MercadoPublico-Inteligencia/tree/main/historico/v1">archivo histórico del repositorio</a>.</p>
          <p><a href="../../">Ir al Observatorio actual</a></p>
          </body></html>
          HTML
          test -f _pages/index.html
          test -f _pages/frontend-v2/data/catalogo-publico.json
          test -f _pages/historico/v1/index.html
          test ! -f _pages/data/observatorio.json
          echo "PAGES_ARCHIVOS_PUBLICOS=$(find _pages -type f | wc -l)"
          du -sh _pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Desplegar preview v2 manteniendo raíz v1
        id: deploy
        uses: actions/deploy-pages@v4
