name: Validar participantes históricos V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend-v2/js/participantes-historicos.js'
      - 'frontend-v2/index.html'
      - 'scripts/generar_participacion_historica_v2.py'
      - '.github/workflows/validar-participantes-v2.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis y cobertura
        run: |
          node --check frontend-v2/js/participantes-historicos.js
          python -m py_compile scripts/generar_participacion_historica_v2.py
          python - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('frontend-v2/data')
          cat=json.loads((root/'catalogo-publico.json').read_text())
          alerts=[]
          for p in cat['periodos']:
           month=p['periodo']
           target=root/'participacion'/month
           meta_path=target/'meta.json'
           if not meta_path.is_file():
            alerts.append(f'{month}: índice de participación ausente; no se considera cobertura completa')
            continue
           meta=json.loads(meta_path.read_text())
           assert meta['version']==1 and meta['periodo']==month, f'{month}: metadatos inválidos'
           for field,source in (('procesos_publicados','procesos'),('ofertas','ofertas')):
            count=meta[field]
            assert isinstance(count,int) and 0<=count<=p['conteos'][source], f'{month}: conteo imposible de {field}'
            if count!=p['conteos'][source]:
             alerts.append(f'{month}: {field} indexados={count}, publicados={p["conteos"][source]} (cobertura parcial o índice desactualizado)')
           for entity,source in (('proveedor','ofertas'),('organismo','procesos')):
            if meta[source if source=='ofertas' else 'procesos_publicados'] and not (target/entity).is_dir():
             alerts.append(f'{month}: faltan fragmentos de {entity}')
           print('PARTICIPACION_AUDITADA',month)
          for message in alerts:
           print('::warning::PARTICIPACION_COBERTURA '+message)
          print('PARTICIPACION_COBERTURA_ALERTAS',len(alerts))
          # La ausencia de datos derivados no debe bloquear pruebas de interfaz;
          # las advertencias son explícitas y no certifican integridad histórica.
          PY
