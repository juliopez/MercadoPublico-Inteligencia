name: Recuperar fecha pendiente de ChileCompra
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha histórica pendiente (AAAA-MM-DD); nunca se sustituye por hoy'
        type: string
        required: true
      modalidad:
        description: 'Modalidad que quedó pendiente'
        type: choice
        required: true
        options:
          - compra_agil
          - licitaciones
permissions:
  contents: read
concurrency:
  group: sync-chilecompra-sheets
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Recuperar fecha explícita sin afectar la carga diaria
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          SYNC_MODALIDAD: ${{ inputs.modalidad }}
          SYNC_FECHA_2026: ${{ inputs.fecha }}
          SYNC_MAX_PAGES: '20'
          API_MAX_ATTEMPTS: '1'
        run: python3 scripts/sync_chilecompra_sheets.py
