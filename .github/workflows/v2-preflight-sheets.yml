name: V2 - validar Google Sheets (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observatorio-v2-pruebas
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias existentes
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Validar estructura y permisos sin escribir
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/preflight_v2_sheets.py
