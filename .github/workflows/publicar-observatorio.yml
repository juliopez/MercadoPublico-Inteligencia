name: Publicar datos del Observatorio
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-datos-observatorio
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Leer Sheets privado y generar datos públicos limitados
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python scripts/publicar_observatorio.py
      - name: Publicar archivo para GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json
          if git diff --cached --quiet; then
            echo "No hay modificaciones"
          else
            git commit -m "data: actualizar extracto de Google Sheets"
            git push
          fi
