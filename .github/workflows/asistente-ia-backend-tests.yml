name: Asistente IA - pruebas aisladas
on:
  push:
    paths:
      - 'scripts/asistente_ia/backend/**'
      - '.github/workflows/asistente-ia-backend-tests.yml'
  pull_request:
    paths:
      - 'scripts/asistente_ia/backend/**'
      - '.github/workflows/asistente-ia-backend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas deterministas sin red
        run: node --test scripts/asistente_ia/backend/*.test.mjs

  indice_octubre_aislado:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar indice de octubre en carpeta temporal
        run: node scripts/asistente_ia/backend/generar_indice_nombres.mjs "$PWD/frontend-v2" 2026-10 "$RUNNER_TEMP/indice-nombres-2026-10"
      - name: Validar cobertura y consulta real
        run: |
          node --input-type=module -e '
          import {readFile} from "node:fs/promises";
          import {join} from "node:path";
          import {buscarEnIndiceLocal} from "./scripts/asistente_ia/backend/lector_indice_nombres.mjs";
          const d=join(process.env.RUNNER_TEMP,"indice-nombres-2026-10");
          const m=JSON.parse(await readFile(join(d,"manifiesto.json"),"utf8"));
          if(m.registros_origen!==705626 || m.archivos.length!==706) throw Error("Cobertura incompleta");
          if(Object.values(m.prefijos).reduce((a,b)=>a+b,0)!==m.entradas) throw Error("Entradas inconsistentes");
          const q=await buscarEnIndiceLocal({directorio:d,consulta:"Makarena Bañares"});
          console.log(JSON.stringify({periodo:m.periodo,registros:m.registros_origen,partes:m.archivos.length,entradas:m.entradas,prefijos:Object.keys(m.prefijos).length,coincidencias:q.total_coincidencias}));
          '
      - name: Guardar manifiesto de auditoria
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manifiesto-indice-nombres-2026-10
          path: ${{ runner.temp }}/indice-nombres-2026-10/manifiesto.json
          retention-days: 7
