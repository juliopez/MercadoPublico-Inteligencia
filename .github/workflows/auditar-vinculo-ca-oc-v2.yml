name: Auditar vínculo Compra Ágil OC V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auditar-vinculo-ca-oc-v2.yml'
permissions:
  contents: write
concurrency:
  group: auditoria-vinculo-ca-oc-v2
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxis
        run: python -m py_compile scripts/auditar_vinculo_ca_oc_historico_v2.py
      - name: Auditar caso 839-4-COT26 en todos los históricos V2
        run: |
          python scripts/auditar_vinculo_ca_oc_historico_v2.py
          python - <<'PY'
          import json
          j=json.load(open('docs/auditorias/AUDITORIA_VINCULO_839-4-COT26_2026-10-21.json'))
          assert j['codigo_proceso']=='839-4-COT26'
          assert j['registros_oc_escaneados']==693688, j['registros_oc_escaneados']
          assert len(j['periodos_consultados'])==5
          print('INFORME_AUDITORIA_VALIDADO',j['caso']['ofertas'],j['caso']['resultados'],len(j['caso']['ordenes_compra_enlazadas_exactamente']))
          PY
      - name: Publicar informe de auditoría (no cambia datos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditorias/AUDITORIA_VINCULO_839-4-COT26_2026-10-21.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(v2): evidencia del vínculo OC para 839-4-COT26"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
