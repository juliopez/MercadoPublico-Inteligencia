name: Observatorio - publicar datos Sheets y front
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-sheets-pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatorio-operacion-unica
  cancel-in-progress: false
jobs:
  publicar-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de Google Sheets
        run: pip install --disable-pip-version-check 'gspread==6.2.1' 'google-auth==2.40.3'
      - name: Exportar ultima version desde Sheets sin consultar ChileCompra
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python3 scripts/publicar_observatorio.py
      - name: Verificar JSON antes de publicar
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/observatorio.json').read_text(encoding='utf-8'))
          count=0
          for table,parts in manifest['partes'].items():
            total=0
            for part in parts:
              records=json.loads(Path(part).read_text(encoding='utf-8'))
              assert isinstance(records,list),part
              total+=len(records)
              count+=1
            assert total==manifest['conteos'][table],(table,total)
          print('JSON_VALIDADO',count,'fragmentos',sum(manifest['conteos'].values()),'registros')
          PY
      - name: Persistir instantanea publica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/observatorio.json data/partes
          if ! git diff --cached --quiet; then
            git commit -m "data: publicar ultima instantanea desde Sheets"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar front con datos actualizados
        id: deploy
        uses: actions/deploy-pages@v4
