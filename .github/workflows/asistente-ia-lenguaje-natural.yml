name: Asistente IA - lenguaje natural aislado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis
        run: node --check scripts/asistente_ia/backend/interpretar_local.mjs
      - name: Ejecutar pruebas de lenguaje natural
        run: node --test scripts/asistente_ia/backend/interpretar_local.test.mjs
