name: Asistente IA - consultas reales en Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis del validador
        run: node --check scripts/asistente_ia/backend/validar_consultas_reales.mjs
      - name: Validar consultas deterministas contra datos públicos actuales
        run: node scripts/asistente_ia/backend/validar_consultas_reales.mjs
