name: Reconstruir proveedor seleccionado en Resultados
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconstruir-seleccionados-20261029.yml']
permissions:
  contents: write
  actions: write
jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gspread>=6,<7' 'google-auth>=2,<3'
      - name: Exportar selección desde Google Sheets sin llamar API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/exportar_mer_operativo_v2.py --periodo 2026-10 --aplicar --incluir-api
      - name: Validar relación entre cotización y proveedor
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('frontend-v2/data')
          m=json.loads((root/'catalogo-publico.json').read_text())
          p=next(x for x in m['periodos'] if x['periodo']=='2026-10')
          rows=[]
          for rel in p['partes']['resultados']:
              rows.extend(json.loads((root/rel.removeprefix('data/')).read_text()))
          print('RESULTADOS',len(rows),'PROVEEDOR_SELECCIONADO',sum(bool(x.get('proveedor_seleccionado')) for x in rows))
          assert rows and all(x.get('proveedor_seleccionado') for x in rows)
          PY
      - name: Publicar datos derivados por workflow existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-v2/data/catalogo-publico.json frontend-v2/data/partes/procesos/ frontend-v2/data/partes/ofertas/ frontend-v2/data/partes/resultados/ frontend-v2/data/partes/ordenescompra/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "data(v2): identificar proveedores seleccionados en resultados"
            git pull --rebase origin main
            git push origin main
          fi
          gh workflow run publicacion-v2-post-etl.yml --ref main
