name: Inspeccionar esquema listado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Analizar claves internas sin publicar datos
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python3 scripts/esquema_listado.py
