<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Asistente IA · Gemini experimental</title>
<link rel="stylesheet" href="../css/asistente-ia.css">
<style>body{font:16px/1.55 system-ui,sans-serif;background:#f5f7fb;color:#14283b;margin:0}main{max-width:760px;margin:5vh auto;padding:24px}.aviso{background:#fff8e9;border-left:4px solid #b5791b;padding:14px;margin-bottom:20px}</style>
</head>
<body><main>
<h1>Asistente IA · Gemini experimental</h1>
<p class="aviso"><strong>Prueba aislada, no integrada al Observatorio productivo.</strong> Las consultas se envían al Worker de Cloudflare, que utiliza Gemini para interpretar y el motor determinista para calcular con fuentes públicas verificadas. No modifica registros.</p>
<div id="asistente"></div>
</main>
<script type="module">
import { crearAsistenteUI } from '../js/asistente-ia-ui.js?v=20261113-formato1';
const ENDPOINT = 'https://observatorio-mercado-publico-ia.julio-c-lopez-n-1972.workers.dev/chat';
async function consultar(pregunta) {
  const controlador = new AbortController();
  const limite = setTimeout(() => controlador.abort(), 30000);
  try {
    const respuesta = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({pregunta}),
      signal: controlador.signal
    });
    if (!respuesta.ok) throw new Error('Worker HTTP ' + respuesta.status);
    const dato = await respuesta.json();
    if (dato?.estado === 'aclaracion' && typeof dato.pregunta_aclaracion === 'string') return dato;
    if (dato?.estado === 'respondida' && dato.resultado && typeof dato.resultado === 'object') return dato;
    throw new Error('Contrato de respuesta no reconocido');
  } finally {
    clearTimeout(limite);
  }
}
crearAsistenteUI({contenedor:document.getElementById('asistente'),consultar,habilitado:true});
</script>
</body></html>
