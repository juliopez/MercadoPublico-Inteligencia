<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Asistente IA · Gemini experimental</title><link rel="stylesheet" href="../css/asistente-ia.css"><style>body{font:16px/1.55 system-ui,sans-serif;background:#f5f7fb;color:#14283b;margin:0}main{max-width:760px;margin:5vh auto;padding:24px}.aviso{background:#fff8e9;border-left:4px solid #b5791b;padding:14px;margin-bottom:20px}</style></head>
<body><main><h1>Asistente IA · Gemini experimental</h1><p class="aviso"><strong>Prueba aislada, no integrada al Observatorio productivo.</strong> Esta página consulta el Worker existente de Cloudflare/Gemini. Las cifras deben contrastarse con las fuentes públicas. No se declara validada la integración completa con el nuevo motor determinista.</p><div id="asistente"></div></main>
<script type="module">
import { crearAsistenteUI } from '../js/asistente-ia-ui.js';
const ENDPOINT='https://observatorio-mercado-publico-ia.julio-c-lopez-n-1972.workers.dev/chat';
async function consultar(pregunta) {
 const controlador=new AbortController();
 const limite=setTimeout(()=>controlador.abort(),25000);
 try {
  const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pregunta,mensaje:pregunta,message:pregunta}),signal:controlador.signal});
  if(!res.ok)throw new Error('Worker HTTP '+res.status);
  const dato=await res.json();
  if(dato.estado==='aclaracion')return dato;
  if(dato.estado==='respondida'&&dato.resultado)return dato;
  const texto=[dato.respuesta,dato.answer,dato.text,dato.mensaje,dato.explicacion,dato.response].find(x=>typeof x==='string'&&x.trim());
  if(!texto)throw new Error('Contrato de respuesta desconocido');
  return {estado:'respondida',resultado:{explicacion:texto,datos:dato.datos||{},fuentes:Array.isArray(dato.fuentes)?dato.fuentes:[]}};
 } finally {clearTimeout(limite);}
}
crearAsistenteUI({contenedor:document.getElementById('asistente'),consultar,habilitado:true});
</script></body></html>
